reason = "braces@3.0.3 has no patched release as of 2026-10-10. Dependency path: eslint-config-next@16.4.0 (devDependency) > @next/eslint-plugin-next@16.4.0 > fast-glob@3.3.1 > micromatch@4.0.8 > braces@3.0.3. Reachability evidence: dist/utils/get-root-dirs.js is the only fast-glob caller in @next/eslint-plugin-next, and it globs only settings.next.rootDir; eslint.config.mjs sets no rootDir, so getRootDirs() returns context.cwd without calling fast-glob. Nothing ships to the deployed site. Approved by Andrew on 2026-10-10. Re-evaluation owner: Andrew; review when braces publishes a patch, the eslint-config-next chain drops it, or a rootDir setting is added."
